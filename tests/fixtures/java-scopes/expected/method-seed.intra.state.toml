# filer bundle state — `:FilerReset` clears the current branch, `:FilerResetAll` everything
root = "<root>"
version = 3

[[bundles]]
name = "<branch>"
created = <timestamp>
depth = 2

[[bundles.entries]]
path = "src/main/java/com/example/method/Pipeline.java"
scope = "methods"
symbol = "Pipeline"
methods = [
    "prepare",
    "run",
    "toResult",
]
depth = 0
reason = "seed"
