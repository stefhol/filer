# filer bundle state — `:FilerReset` clears the current branch, `:FilerResetAll` everything
root = "<root>"
version = 3

[[bundles]]
name = "<branch>"
created = <timestamp>
depth = 2

[[bundles.entries]]
path = "src/main/java/com/example/method/base/Job.java"
scope = "methods"
symbol = "Job"
methods = [
    "labels",
    "runOnce",
    "step",
]
depth = 0
reason = "seed"
