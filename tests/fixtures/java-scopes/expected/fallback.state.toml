# filer bundle state — `:FilerReset` clears the current branch, `:FilerResetAll` everything
root = "<root>"
version = 3

[[bundles]]
name = "<branch>"
created = <timestamp>
depth = 2

[[bundles.entries]]
path = "src/main/java/com/example/fallback/Controller.java"
scope = "symbol"
symbol = "Controller"
depth = 0
reason = "seed"

[[bundles.entries]]
path = "src/main/java/com/example/fallback/Bridge.java"
scope = "methods"
symbol = "Bridge"
methods = ["lookup"]
depth = 1
reason = "call"

[[bundles.entries]]
path = "src/main/java/com/example/fallback/Repo.java"
scope = "symbol"
symbol = "Repo"
depth = 1
reason = "call"
