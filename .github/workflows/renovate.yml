name: Renovate

on:
  schedule:
    # Daily at 03:00 UTC. Renovate policy (release age, grouping, base branch)
    # lives in renovate.json.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options: [debug, info, warn, error]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      # Self-hosted Renovate. The token must be a PAT or GitHub App token with
      # `contents: write` and `pull_requests: write` (RENOVATE_TOKEN secret);
      # the workflow GITHUB_TOKEN is read-only and cannot open PRs.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PR_HOURLY_LIMIT: "4"
