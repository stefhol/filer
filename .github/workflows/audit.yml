name: Audit

on:
  schedule:
    # Daily at 03:30 UTC, half an hour after Renovate.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: audit
  cancel-in-progress: false

env:
  ISSUE_TITLE: "Security: RustSec advisories in dependencies"

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        id: audit
        shell: bash
        run: |
          set -uo pipefail
          cargo audit --json > audit.json
          status=$?

          if ! jq -e . audit.json > /dev/null 2>&1; then
            echo "cargo-audit did not produce JSON (exit $status)" >&2
            exit "$status"
          fi

          count=$(jq -r '.vulnerabilities.count // 0' audit.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "## cargo audit"
            echo
            if [ "$count" -eq 0 ]; then
              echo "No RustSec advisories in \`Cargo.lock\`."
            else
              echo "\`$count\` advisory/advisories found in \`Cargo.lock\`:"
              echo
              echo "| Advisory | Crate | Version | Summary |"
              echo "| --- | --- | --- | --- |"
              jq -r '.vulnerabilities.list[] | "| `\(.advisory.id)` | `\(.package.name)` | `\(.package.version)` | [\(.advisory.title)](\(.advisory.url)) |"' audit.json
            fi
            warnings=$(jq -r '.warnings | length' audit.json)
            if [ "$warnings" -gt 0 ]; then
              echo
              echo "### Warnings"
              echo
              jq -r '.warnings[] | "- `\(.advisory.id)` \(.advisory.title) (`\(.package.name)` \(.package.version))"' audit.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Open or update tracking issue
        # Runs even though the audit step failed (that is the point).
        if: always() && steps.audit.outputs.count != '0' && steps.audit.outputs.count != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "Daily \`cargo audit\` found advisories in \`Cargo.lock\` on \`master\`."
            echo
            echo "| Advisory | Crate | Version | Summary |"
            echo "| --- | --- | --- | --- |"
            jq -r '.vulnerabilities.list[] | "| `\(.advisory.id)` | `\(.package.name)` | `\(.package.version)` | [\(.advisory.title)](\(.advisory.url)) |"' audit.json
            echo
            echo "_Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID_"
          } > body.md

          # Match the title locally: GitHub's `in:title` search does not reliably
          # match a quoted phrase, which produced duplicate issues.
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" \
            | sort -n | head -n1)

          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi
