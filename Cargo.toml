[package]
name = "filer"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
description = "Bundle sources and their import closure into chat-ready markdown"
license = "MIT"
repository = "https://github.com/stefhol/filer"
homepage = "https://github.com/stefhol/filer"

[[bin]]
name = "filer"
path = "src/main.rs"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dekobon-tree-sitter-groovy = "0.3.0"
globset = "0.4.21"
ignore = "0.4.34"
json5 = "1.3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26"
tree-sitter-typescript = "0.23.2"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
