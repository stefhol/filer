[package]
name = "filer"
version = "0.1.0"
edition = "2021"
description = "Bundle Java sources and their import closure into chat-ready markdown"
license = "MIT"

[[bin]]
name = "filer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
